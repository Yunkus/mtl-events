<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montreal Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Carlito: free stand-in with Calibri's exact metrics, for devices without Calibri (phones, Macs) -->
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/YoungSerif-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Bright amber, dark amber, black and cloud white (greys are only shades between black and white).
     black #0b0b0b · panels #161616 · lines #2a2a2a · cloud white #f2f2ee · dimmed white #a9a9a5
     bright amber #ffb000 · dark amber #c46a00 */
  :root {
    color-scheme: dark;
    --black: #0b0b0b; --black-2: #161616; --black-line: #2a2a2a; --cloud: #f2f2ee; --cloud-dim: #a9a9a5;
    --amber: #ffb000; --amber-dark: #c46a00;
    --bg: var(--black); --surface: var(--black-2); --text: var(--cloud); --muted: var(--cloud-dim); --line: var(--black-line);
    --accent: var(--amber); --accent-ink: var(--amber); --on-accent: var(--black); --pick: var(--amber);
    --chip: var(--black-2); --chip-on: var(--amber); --chip-on-text: var(--black);
    --band: linear-gradient(180deg, #181818 0%, var(--black) 100%); --band-text: var(--cloud);
    --band-muted: var(--cloud-dim); --band-line: var(--amber-dark);
    --band-primary: var(--amber); --band-primary-text: var(--black); --mark: var(--amber);
    --free: var(--black); --free-bg: var(--amber-dark); --picked-row: rgba(255, 176, 0, .12);
    --serif: "Young Serif", Georgia, "Times New Roman", serif;
    --sans: Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
  }
  ::placeholder { color: var(--cloud-dim); }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); min-height: 100vh;
         background: radial-gradient(120% 60% at 50% 0%, rgba(255, 176, 0, .07), transparent 60%), var(--bg);
         font: 16px/1.45 var(--sans); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 8px 16px 96px; }
  .band { background: var(--band); color: var(--band-text); border-bottom: 2px solid var(--amber-dark); }
  .band .in { max-width: 860px; margin: 0 auto; padding: 24px 16px 0; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font: 400 32px/1.15 var(--serif); letter-spacing: -0.01em; }
  h1::before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 11px; vertical-align: 5px;
               background: radial-gradient(circle at 35% 30%, var(--cloud), var(--amber) 40%, var(--amber-dark));
               box-shadow: 0 0 12px rgba(255, 176, 0, .55); }   /* a little amber glass bead */
  .meta { color: var(--muted); font-size: 13px; }
  .band .meta { color: var(--band-muted); }
  .sub { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px;
         padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.primary { background: linear-gradient(180deg, var(--amber), #f09a00); border-color: var(--amber-dark); color: var(--on-accent); font-weight: 600; }
  .band .btn.primary, .bar .btn.primary { background: linear-gradient(180deg, var(--amber), #f09a00); border-color: var(--amber-dark); color: var(--band-primary-text); }
  .band .btn:not(.primary), .bar .btn:not(.primary) { background: transparent; color: var(--band-text); border-color: var(--band-line); }
  .band .btn:not(.primary):hover, .bar .btn:not(.primary):hover { border-color: var(--band-text); }
  .tabs { display: flex; gap: 4px; margin: 18px 0 0; flex-wrap: wrap; }
  .tab { border: 0; background: none; color: var(--band-muted); font: 400 16px/1.2 var(--serif); cursor: pointer; white-space: nowrap;
         padding: 9px 12px; border-radius: 8px 8px 0 0; }
  .tab:hover { color: var(--band-text); }
  .tab[aria-selected="true"] { color: var(--amber); background: var(--bg); box-shadow: inset 0 2px 0 var(--amber); }   /* folder tab joining the page */
  .tab .n { font: 400 13px/1 var(--sans); margin-left: 4px; opacity: .8; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 8px; }
  .chips:empty { display: none; }
  /* venue chips: filled with a dark-amber edge when shown, faint outline when hidden */
  .chip { border: 1px solid var(--black-line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px;
          font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--chip); border-color: var(--amber-dark); color: var(--text); }
  .chip .n { font-weight: 400; margin-left: 4px; }
  .chip.bad { text-decoration: line-through; opacity: .55; }
  .chip.special { border: 1px solid var(--cloud-dim); background: transparent; color: var(--text); }
  .datebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; margin-bottom: 6px; }
  .datebar input[type=date] { font: inherit; font-size: 15px; font-weight: 600; color: var(--text); background: var(--surface);
                              border: 1px solid var(--amber-dark); border-radius: 8px; padding: 5px 10px; }
  .datebar .btn { padding: 5px 11px; font-size: 15px; }
  .day.group h2 { color: var(--amber); font: 400 19px/1.2 var(--serif); text-transform: none; letter-spacing: 0; }
  .chip.special[aria-pressed="true"] { background: var(--free-bg); color: var(--free); border-color: var(--free-bg); }
  .chip.special.pick[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  .sep { width: 1px; background: var(--line); margin: 2px 4px; }
  .search { width: 100%; margin: 12px 0 4px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
            background: var(--surface); color: var(--text); font: inherit; }
  .day { margin-top: 28px; }
  .day h2 { font: 400 15px/1.3 var(--serif); letter-spacing: .01em; color: var(--muted);
            margin: 0 0 8px; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 1; }
  .ev { display: grid; grid-template-columns: 26px 64px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
  .ev.wide { grid-template-columns: 26px 110px 1fr; }
  .ev.movie { grid-template-columns: 1fr; }
  .ev.on { background: var(--picked-row); }
  .ev time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; padding-top: 1px; }
  .ev input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0 2px; accent-color: var(--pick); cursor: pointer; }
  .ev .t { color: var(--text); text-decoration: none; font-weight: 600; }
  .ev a.t:hover { color: var(--accent-ink); }
  .ev .where { color: var(--muted); font-size: 13px; }
  .ev .src { color: var(--accent-ink); font-weight: 600; }
  .free { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
          color: var(--free); background: var(--free-bg); border-radius: 4px; padding: 1px 6px; }
  .times { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .times button { font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); background: var(--surface);
                  border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .times button:hover { border-color: var(--accent); }
  .times button[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-text); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--band); color: var(--band-text); border-top: 2px solid var(--amber-dark);
         transform: translateY(110%); transition: transform .2s; z-index: 5; }
  .bar.show { transform: none; }
  .bar .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .count { font-weight: 600; margin-right: auto; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text);
           width: min(560px, calc(100vw - 32px)); padding: 0; }
  dialog::backdrop { background: rgba(0, 0, 0, .8); }
  dialog .hd { padding: 16px 18px 8px; } dialog h3 { margin: 0 0 4px; font: 400 20px/1.2 var(--serif); }
  dialog .list { max-height: 55vh; overflow: auto; padding: 0 18px; }
  dialog .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  dialog .row .w { color: var(--muted); font-size: 13px; }
  dialog .ft { padding: 12px 18px 16px; display: flex; justify-content: flex-end; }
  .toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: var(--chip-on);
           color: var(--chip-on-text); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
           transition: opacity .2s; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="band"><div class="in">
  <header>
    <div>
      <h1 id="title">Montreal Events</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div class="sub" title="Subscribe to every event in this tab. The feed updates automatically.">
      <a class="btn primary" id="gcal" target="_blank" rel="noopener">Subscribe in Google Calendar</a>
      <a class="btn" id="webcal">Apple / Outlook</a>
      <button class="btn" id="copy">Copy feed URL</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></div>
<div class="wrap">
  <div class="chips" id="chips"></div>
  <input class="search" id="q" type="search">
  <div class="hint" id="hint"></div>
  <main id="list"></main>
</div>
<div class="bar" id="bar"><div class="in">
  <span class="count" id="count"></span>
  <button class="btn primary" id="dl">Add to calendar (.ics)</button>
  <button class="btn" id="gpick">Google Calendar…</button>
  <button class="btn" id="clear">Clear</button>
</div></div>
<dialog id="gdlg">
  <div class="hd">
    <h3>Add to Google Calendar</h3>
    <div class="meta">Google only takes one event per link, so add each one below.
      For many at once, use <b>Add to calendar (.ics)</b> and import the file in Google Calendar
      (Settings → Import &amp; export).</div>
  </div>
  <div class="list" id="glist"></div>
  <div class="ft"><button class="btn" id="gclose">Done</button></div>
</dialog>
<div class="toast" id="toast">Copied</div>
<script>
const TAB_LABEL = { music: "Music & Dance", other: "Other Events", bars: "Bar Nights", museums: "Museums", movies: "Movies",
                    date: "By Date" };
const PLACEHOLDER = { music: "Search artists, titles, rooms…", other: "Search events, venues…",
                      bars: "Search bars, streets…", museums: "Search exhibitions, museums…", movies: "Search films, cinemas…",
                      date: "Search this day…" };
// "By Date" view: everything on one day, in this order of types
const DAY_GROUPS = [
  ["Music & Dance", e => e.tab === "music"],
  ["Other Events", e => e.tab === "other"],
  ["Bar Nights", e => e.tab === "bars"],
  ["Museum events", e => e.tab === "museums" && e.kind !== "exhibition"],
  ["Exhibitions on view", e => e.tab === "museums" && e.kind === "exhibition"],
  ["Movies", e => e.tab === "movies"],
];
const EVENT_TABS = ["music", "other", "bars"];   // tabs filtered by venue chips
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let hidden = new Set(store.get("hiddenSources", []));
let museumView = store.get("museumView", "events");
let freeOnly = store.get("freeOnly", false);
let picksOnly = false;
let picked = new Set(store.get("picked", []));

const TZ = "America/Montreal";
const dayFmt = new Intl.DateTimeFormat("en-CA", { weekday: "long", month: "long", day: "numeric", timeZone: TZ });
const shortFmt = new Intl.DateTimeFormat("en-CA", { month: "short", day: "numeric", timeZone: TZ });
const shortYFmt = new Intl.DateTimeFormat("en-CA", { month: "short", day: "numeric", year: "numeric", timeZone: TZ });
const timeFmt = new Intl.DateTimeFormat("en-CA", { hour: "numeric", minute: "2-digit", timeZone: TZ });
const keyFmt = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", timeZone: TZ });
const noon = s => new Date(s + "T12:00:00-05:00");   // plain dates: anchor at local noon so they land on the right day
const today = keyFmt.format(new Date());

function parse(e) {
  const d = e.all_day ? noon(e.start) : new Date(e.start);
  return { ...e, tab: e.tab || "events", d, key: keyFmt.format(d), id: e.id || (e.source + "|" + e.url + "|" + e.start) };
}
function el(tag, cls, text) { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
function link(href, cls, text) { const a = el("a", cls, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

// ---------- calendar export for picked events
const nextDay = s => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); };
const utc = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const ymd = s => s.replace(/-/g, "");
function entries(e) {
  // [summary, allDay, start, end]; exhibitions become their opening day (if ahead) and last day
  const where = e.source === "Musées Montréal" && e.location ? e.location : e.source;
  if (e.kind === "exhibition") {
    const out = [];
    if (e.start >= today) out.push([`Opens: ${e.title} @ ${e.location}`, true, e.start, nextDay(e.start)]);
    if (e.end && e.end !== e.start) out.push([`Last day: ${e.title} @ ${e.location}`, true, e.end, nextDay(e.end)]);
    return out;
  }
  const title = `${e.free ? "FREE · " : ""}${e.title} @ ${where}`;
  if (e.all_day) return [[title, true, e.start, e.end && e.end > e.start ? e.end : nextDay(e.start)]];
  let end = e.end ? new Date(e.end) : null;
  if (!end || isNaN(end) || end <= e.d) end = new Date(e.d.getTime() + 3 * 3600e3);
  return [[title, false, e.d, end]];
}
const details = e => [e.source, e.free ? "Free" : e.price, e.url].filter(Boolean).join("\n");
function ics(evs) {
  const esc = s => String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  const fold = l => { const out = []; while (l.length > 73) { out.push(l.slice(0, 73)); l = " " + l.slice(73); } out.push(l); return out.join("\r\n"); };
  const stamp = utc(new Date());
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Montreal Event Calendar//picks//EN", "CALSCALE:GREGORIAN"];
  for (const e of evs) entries(e).forEach(([sum, allDay, s, en], i) => {
    L.push("BEGIN:VEVENT", `UID:${e.id}${i ? "-" + i : ""}@mtl-events`, `DTSTAMP:${stamp}`,
      allDay ? `DTSTART;VALUE=DATE:${ymd(s)}` : `DTSTART:${utc(s)}`,
      allDay ? `DTEND;VALUE=DATE:${ymd(en)}` : `DTEND:${utc(en)}`,
      `SUMMARY:${esc(sum)}`, `DESCRIPTION:${esc(details(e))}`);
    if (e.url) L.push(`URL:${e.url}`);
    if (e.location) L.push(`LOCATION:${esc(e.location)}`);
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n") + "\r\n";
}
function googleLinks(e) {
  return entries(e).map(([sum, allDay, s, en]) => {
    const p = new URLSearchParams({ action: "TEMPLATE", text: sum, details: details(e), location: e.location || "",
      dates: allDay ? `${ymd(s)}/${ymd(en)}` : `${utc(s)}/${utc(en)}`, ctz: TZ });
    return [sum, "https://calendar.google.com/calendar/render?" + p];
  });
}

fetch("events.json", { cache: "no-cache" }).then(r => r.json()).then(data => {
  const events = data.events.map(parse);
  const byId = new Map(events.map(e => [e.id, e]));
  picked = new Set([...picked].filter(id => byId.has(id)));   // forget picks that have passed
  const tabsInfo = data.tabs || { events: { title: "Montreal Events", feed: "calendar.ics" } };
  const sources = data.sources;
  const srcTab = n => (sources[n] && sources[n].tab) || "events";
  const gen = new Date(data.generated).toLocaleString("en-CA", { dateStyle: "medium", timeStyle: "short" });

  const tabIds = Object.keys(tabsInfo);
  const allTabs = [...tabIds, "date"];
  // "#events" is the old single Events tab; "#date/2026-12-05" opens By Date on that day
  const fix = t => (t === "events" ? "music" : t.startsWith("date") ? "date" : t);
  const lastDay = events.reduce((m, e) => (e.key > m ? e.key : m), today);
  let dayPick = (location.hash.match(/^#date\/(\d{4}-\d{2}-\d{2})$/) || [])[1] || today;
  let tab = fix(location.hash.slice(1));
  if (!allTabs.includes(tab)) tab = fix(store.get("tab", "music"));
  if (!allTabs.includes(tab)) tab = tabIds[0];

  const tabsEl = $("tabs");
  const tabBtns = {};
  for (const id of allTabs) {
    const b = el("button", "tab"); b.setAttribute("role", "tab");
    b.append(TAB_LABEL[id] || id);
    if (id !== "date") b.appendChild(el("span", "n", events.filter(e => e.tab === id).length));
    b.onclick = () => select(id);
    tabsEl.appendChild(b); tabBtns[id] = b;
  }
  const feedUrl = () => new URL((tabsInfo[tab] || tabsInfo[tabIds[0]]).feed, location.href).href;
  $("copy").onclick = async () => { try { await navigator.clipboard.writeText(feedUrl()); } catch (e) {} toast("Feed URL copied"); };
  $("q").oninput = render;

  // ---------- picks
  const pickedEvents = () => [...picked].map(id => byId.get(id)).filter(Boolean).sort((a, b) => a.d - b.d);
  function savePicks() { store.set("picked", [...picked]); updateBar(); }
  function toggle(id, on) { (on ?? !picked.has(id)) ? picked.add(id) : picked.delete(id); savePicks(); }
  function updateBar() {
    const n = picked.size;
    $("bar").classList.toggle("show", n > 0);
    $("count").textContent = `${n} event${n === 1 ? "" : "s"} selected`;
    const pc = document.querySelector(".chip.pick .n"); if (pc) pc.textContent = n;
  }
  $("dl").onclick = () => {
    const blob = new Blob([ics(pickedEvents())], { type: "text/calendar;charset=utf-8" });
    const a = el("a"); a.href = URL.createObjectURL(blob); a.download = "montreal-picks.ics";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Downloaded. Open the file to add the events to your calendar.");
  };
  $("gpick").onclick = () => {
    const list = $("glist"); list.innerHTML = "";
    for (const e of pickedEvents()) for (const [sum, href] of googleLinks(e)) {
      const row = el("div", "row"); const left = el("div");
      left.append(el("div", null, sum), el("div", "w", e.all_day ? shortFmt.format(e.d) : dayFmt.format(e.d) + ", " + timeFmt.format(e.d)));
      const a = link(href, "btn primary", "Add"); a.onclick = () => { a.textContent = "Added ✓"; a.classList.remove("primary"); };
      row.append(left, a); list.appendChild(row);
    }
    $("gdlg").showModal();
  };
  $("gclose").onclick = () => $("gdlg").close();
  $("clear").onclick = () => { picked.clear(); savePicks(); if (picksOnly) picksOnly = false; buildChips(); render(); };

  function select(id) {
    tab = id; store.set("tab", id);
    for (const [k, b] of Object.entries(tabBtns)) b.setAttribute("aria-selected", String(k === id));
    $("q").placeholder = PLACEHOLDER[id] || "Search…";
    document.querySelector(".sub").style.display = id === "date" ? "none" : "";   // no feed for a single day
    if (id === "date") { setDay(dayPick); return; }
    history.replaceState(null, "", "#" + id);
    const info = tabsInfo[id];
    $("title").textContent = info.title; document.title = info.title;
    const url = feedUrl();
    $("webcal").href = url.replace(/^https?:/, "webcal:");
    $("gcal").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(url.replace(/^https?:/, "webcal:"));
    const bad = Object.keys(sources).filter(n => srcTab(n) === id && !sources[n].ok);
    $("meta").textContent = `${events.filter(e => e.tab === id).length} upcoming · updated ${gen}` +
      (bad.length ? ` · not updating: ${bad.join(", ")}` : "");
    $("hint").textContent = id === "movies" ? "Tap showtimes to select them." : "Tick events to add just those to your calendar.";
    buildChips(); render();
  }

  // ---------- By Date view
  const shiftDay = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const onDay = (e, day) => e.kind === "exhibition" ? e.start <= day && (e.end || e.start) >= day : e.key === day;
  function setDay(day) {
    dayPick = day < today ? today : day;
    history.replaceState(null, "", "#date/" + dayPick);
    const n = events.filter(e => onDay(e, dayPick) && e.kind !== "exhibition").length;
    $("title").textContent = dayFmt.format(noon(dayPick)); document.title = "Montreal · " + dayFmt.format(noon(dayPick));
    $("meta").textContent = `${n} event${n === 1 ? "" : "s"} that day, grouped by type · updated ${gen}`;
    $("hint").textContent = "Tick events (or tap movie showtimes) to add just those to your calendar.";
    buildChips(); render();
  }
  function buildDateBar(chips) {
    const bar = el("div", "datebar");
    const prev = el("button", "btn", "‹"); prev.title = "Previous day"; prev.disabled = dayPick <= today;
    prev.onclick = () => setDay(shiftDay(dayPick, -1));
    const input = el("input"); input.type = "date"; input.value = dayPick; input.min = today; input.max = lastDay;
    input.setAttribute("aria-label", "Choose a date");
    input.onchange = () => { if (input.value) setDay(input.value); };
    const next = el("button", "btn", "›"); next.title = "Next day";
    next.onclick = () => setDay(shiftDay(dayPick, 1));
    const now = el("button", "btn", "Today"); now.onclick = () => setDay(today);
    bar.append(prev, input, next, now);
    chips.appendChild(bar);
  }

  function special(label, on, cls, n, onclick) {
    const b = el("button", "chip special " + cls); b.append(label);
    if (n != null) b.appendChild(el("span", "n", n));
    b.setAttribute("aria-pressed", String(on)); b.onclick = onclick; return b;
  }
  function buildChips() {
    const chips = $("chips"); chips.innerHTML = "";
    if (tab === "date") buildDateBar(chips);
    const inTab = events.filter(e => (tab === "date" ? onDay(e, dayPick) : e.tab === tab));
    chips.appendChild(special("Selected", picksOnly, "pick", picked.size, () => { picksOnly = !picksOnly; buildChips(); render(); }));
    if (inTab.some(e => e.free)) {
      chips.appendChild(special("Free only", freeOnly, "", inTab.filter(e => e.free).length,
        () => { freeOnly = !freeOnly; store.set("freeOnly", freeOnly); buildChips(); render(); }));
    }
    if (tab === "date") return;
    chips.appendChild(el("span", "sep"));
    if (tab === "museums") {   // two views instead of source filters
      for (const [v, label] of [["events", "Events"], ["exhibitions", "Exhibitions"]]) {
        const n = inTab.filter(e => (e.kind === "exhibition") === (v === "exhibitions")).length;
        const b = el("button", "chip"); b.append(label, el("span", "n", n));
        b.setAttribute("aria-pressed", String(museumView === v));
        b.onclick = () => { museumView = v; store.set("museumView", v); buildChips(); render(); };
        chips.appendChild(b);
      }
      return;
    }
    const counts = {};
    inTab.forEach(e => counts[e.source] = (counts[e.source] || 0) + 1);
    // chips = sources with events in this tab, plus sources that failed (shown crossed out)
    const names = new Set(Object.keys(counts));
    // (a source that found events filed under other names, like "Added by hand", gets no chip of its own)
    Object.keys(sources).forEach(n => { if (srcTab(n) === tab && (!sources[n].ok || (EVENT_TABS.includes(tab) && !sources[n].count))) names.add(n); });
    if (names.size < 2) { chips.lastChild.remove(); return; }
    [...names].sort().forEach(name => {
      const s = sources[name];
      const b = el("button", "chip" + (s && !s.ok ? " bad" : ""));
      b.append(name, el("span", "n", counts[name] || 0));
      b.title = s && !s.ok ? s.error : "Click to show/hide";
      b.setAttribute("aria-pressed", String(!hidden.has(name)));
      b.onclick = () => { hidden.has(name) ? hidden.delete(name) : hidden.add(name); store.set("hiddenSources", [...hidden]);
                          b.setAttribute("aria-pressed", String(!hidden.has(name))); render(); };
      chips.appendChild(b);
    });
  }

  function matches(e, term) {
    return !term || (e.title + " " + e.location + " " + e.source + " " + (e.kind || "") + (e.free ? " free gratuit" : ""))
      .toLowerCase().includes(term);
  }

  function checkbox(e, row) {
    const c = el("input"); c.type = "checkbox"; c.checked = picked.has(e.id);
    c.setAttribute("aria-label", "Select " + e.title);
    row.classList.toggle("on", c.checked);
    c.onchange = () => { toggle(e.id, c.checked); row.classList.toggle("on", c.checked); if (picksOnly && !c.checked) render(); };
    return c;
  }
  function titleLine(e) {
    const frag = document.createDocumentFragment();
    frag.appendChild(e.url ? link(e.url, "t", e.title) : el("span", "t", e.title));   // bar nights have no page
    if (e.free) frag.appendChild(el("span", "free", "FREE"));
    return frag;
  }

  // One row for an event, styled by its own type (e.tab), so the By Date view can mix types.
  function addRow(e, sec, groups) {
    if (e.tab === "movies") {   // one row per film per cinema per day, a toggle per showtime
      const g = e.key + "|" + e.source + "|" + e.title;
      if (!groups.has(g)) {
        const row = el("div", "ev movie"); const body = el("div");
        body.appendChild(titleLine(e));
        const w = el("div", "where"); w.appendChild(el("span", "src", e.source)); body.appendChild(w);
        const times = el("div", "times"); body.appendChild(times);
        row.appendChild(body); sec.appendChild(row); groups.set(g, times);
      }
      const b = el("button", null, timeFmt.format(e.d));
      b.setAttribute("aria-pressed", String(picked.has(e.id)));
      b.title = "Select this showtime";
      b.onclick = () => { toggle(e.id); b.setAttribute("aria-pressed", String(picked.has(e.id))); if (picksOnly) render(); };
      groups.get(g).appendChild(b);
      return;
    }
    if (e.kind === "exhibition") return exhibitionRow(e, sec, "until " + fmtShort(e.end));
    const row = el("div", "ev");
    row.appendChild(checkbox(e, row));
    row.appendChild(el("time", null, e.all_day ? "—" : timeFmt.format(e.d)));
    const body = el("div");
    body.appendChild(titleLine(e));
    const w = el("div", "where");
    if (e.tab === "museums") {
      w.appendChild(el("span", "src", e.location || e.source));
      if (e.kind) w.append(" · " + e.kind);
    } else {
      w.appendChild(el("span", "src", e.source));
      if (e.location && e.location !== e.source) w.append(" · " + e.location);
    }
    if (!e.free && e.price) w.append(" · " + e.price);
    body.appendChild(w);
    row.appendChild(body); sec.appendChild(row);
  }

  function render() {
    const term = $("q").value.trim().toLowerCase();
    const list = $("list"); list.innerHTML = "";
    if (tab === "date") return renderDay(list, term);
    const freeFilter = freeOnly && events.some(e => e.tab === tab && e.free);   // tabs without price data ignore it
    let shown = events.filter(e => e.tab === tab && matches(e, term) && (!freeFilter || e.free) && (!picksOnly || picked.has(e.id)));
    if (tab === "museums") {
      shown = shown.filter(e => (e.kind === "exhibition") === (museumView === "exhibitions"));
      if (museumView === "exhibitions") return renderExhibitions(list, shown);
    } else if (!picksOnly) {
      shown = shown.filter(e => !hidden.has(e.source));
    }
    if (!shown.length) { list.innerHTML = `<p class="empty">${picksOnly ? "Nothing selected in this tab yet." : "Nothing matches."}</p>`; return; }
    let cur, sec;
    const groups = new Map();
    for (const e of shown) {
      if (e.key !== cur) {
        cur = e.key; sec = el("section", "day"); sec.appendChild(el("h2", null, dayFmt.format(e.d)));
        list.appendChild(sec);
      }
      addRow(e, sec, groups);
    }
  }

  function renderDay(list, term) {
    const all = events.filter(e => onDay(e, dayPick));
    const freeFilter = freeOnly && all.some(e => e.free);
    const shown = all.filter(e => matches(e, term) && (!freeFilter || e.free) && (!picksOnly || picked.has(e.id)));
    for (const [label, test] of DAY_GROUPS) {
      const items = shown.filter(test);
      if (!items.length) continue;
      const count = label === "Movies" ? new Set(items.map(e => e.source + "|" + e.title)).size + " films" : items.length;
      const sec = el("section", "day group"); sec.appendChild(el("h2", null, `${label} · ${count}`));
      const groups = new Map();
      for (const e of items) addRow(e, sec, groups);
      list.appendChild(sec);
    }
    if (!list.children.length) {
      list.innerHTML = `<p class="empty">${all.length ? "Nothing matches." : "Nothing listed for this day yet."}</p>`;
    }
  }

  const fmtShort = s => { const d = noon(s); return (d.getFullYear() === new Date().getFullYear() ? shortFmt : shortYFmt).format(d); };
  function exhibitionRow(e, sec, when) {
    const row = el("div", "ev wide");
    row.append(checkbox(e, row), el("time", null, when));
    const body = el("div"); body.appendChild(titleLine(e));
    const w = el("div", "where"); w.appendChild(el("span", "src", e.location || e.source));
    body.appendChild(w); row.appendChild(body); sec.appendChild(row);
  }

  function renderExhibitions(list, shown) {
    if (!shown.length) { list.innerHTML = '<p class="empty">Nothing matches.</p>'; return; }
    const now = shown.filter(e => e.start <= today).sort((a, b) => a.end.localeCompare(b.end));
    const soon = shown.filter(e => e.start > today).sort((a, b) => a.start.localeCompare(b.start));
    for (const [label, items, when] of [
      ["On now · closing soonest first", now, e => "until " + fmtShort(e.end)],
      ["Opening soon", soon, e => fmtShort(e.start) + " – " + fmtShort(e.end)],
    ]) {
      if (!items.length) continue;
      const sec = el("section", "day"); sec.appendChild(el("h2", null, label));
      for (const e of items) exhibitionRow(e, sec, when(e));
      list.appendChild(sec);
    }
  }

  window.addEventListener("hashchange", () => {
    const h = fix(location.hash.slice(1));
    const d = (location.hash.match(/^#date\/(\d{4}-\d{2}-\d{2})$/) || [])[1];
    if (h === "date" && d && d !== dayPick) { dayPick = d; select("date"); }
    else if (allTabs.includes(h) && h !== tab) select(h);
  });
  store.set("picked", [...picked]);
  updateBar();
  select(tab);
}).catch(err => { $("meta").textContent = "Could not load events.json (" + err + ")"; console.error(err); });
</script>
</body>
</html>
