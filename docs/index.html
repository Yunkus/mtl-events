<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Out Montreal</title>
<meta name="description" content="Concerts, club nights, comedy, bar nights, galleries, museums and films in Montreal. Updated every 6 hours.">
<meta name="theme-color" content="#0b0b0b">
<!-- link previews (iMessage, WhatsApp, Slack…) -->
<meta property="og:site_name" content="Go Out Montreal">
<meta property="og:title" content="Go Out Montreal">
<meta property="og:description" content="What's on tonight in Montreal: concerts, club nights, comedy, galleries, museums and films.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yunkus.github.io/mtl-events/">
<meta property="og:image" content="https://yunkus.github.io/mtl-events/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- installable app -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Go Out MTL">
<link rel="preload" href="fonts/ShareTech-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<style>
  /* Bright amber, dark amber, black and cloud white (greys are only shades between black and white).
     black #0b0b0b · panels #161616 · lines #2a2a2a · cloud white #f2f2ee · dimmed white #a9a9a5
     bright amber #ffb000 · dark amber #c46a00 */
  /* Fonts shipped with the site (SIL Open Font License; licences in fonts/):
     Share Tech for all text */
  @font-face { font-family: "Share Tech"; src: url("fonts/ShareTech-Regular.ttf") format("truetype");
               font-weight: 400; font-style: normal; font-display: swap; }
  :root {
    color-scheme: dark;
    --black: #0b0b0b; --black-2: #161616; --black-line: #2a2a2a; --cloud: #f2f2ee; --cloud-dim: #a9a9a5;
    --amber: #ffb000; --amber-dark: #c46a00;
    --bg: var(--black); --surface: var(--black-2); --text: var(--cloud); --muted: var(--cloud-dim); --line: var(--black-line);
    --accent: var(--amber); --accent-ink: var(--amber); --on-accent: var(--black); --pick: var(--amber);
    --chip: var(--black-2); --chip-on: var(--amber); --chip-on-text: var(--black);
    --band: linear-gradient(180deg, #181818 0%, var(--black) 100%); --band-text: var(--cloud);
    --band-muted: var(--cloud-dim); --band-line: var(--amber-dark);
    --band-primary: var(--amber); --band-primary-text: var(--black); --mark: var(--amber);
    --free: var(--black); --free-bg: var(--amber-dark); --picked-row: rgba(255, 176, 0, .12);
    --serif: var(--sans);   /* headings and tabs use Share Tech too */
    --sans: "Share Tech", "Segoe UI", system-ui, sans-serif;
  }
  ::placeholder { color: var(--cloud-dim); }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); min-height: 100vh;
         background: radial-gradient(120% 60% at 50% 0%, rgba(255, 176, 0, .07), transparent 60%), var(--bg);
         font: 16px/1.45 var(--sans); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 8px 16px 96px; }
  .band { background: var(--band); color: var(--band-text); border-bottom: 2px solid var(--amber-dark); }
  .band .in { max-width: 860px; margin: 0 auto; padding: 24px 16px 0; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font: 400 32px/1.15 var(--serif); letter-spacing: -0.01em; }
  /* logo at the top: a transparent image, so it sits straight on the header */
  .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .logo { height: 88px; width: auto; flex: none; display: block; margin: -4px 0; }
  /* the site name, as an image */
  .wordmark { display: block; width: min(440px, 100%); height: auto; margin-bottom: 10px; }
  .brand > div { min-width: 0; flex: 1; }
  @media (max-width: 560px) { .logo { height: 64px; margin: -2px 0; } .wordmark { width: 100%; } }
  .meta { color: var(--muted); font-size: 13px; }
  .band .meta { color: var(--band-muted); }
  .sub { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px;
         padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.primary { background: linear-gradient(180deg, var(--amber), #f09a00); border-color: var(--amber-dark); color: var(--on-accent); font-weight: 600; }
  .band .btn.primary, .bar .btn.primary { background: linear-gradient(180deg, var(--amber), #f09a00); border-color: var(--amber-dark); color: var(--band-primary-text); }
  .band .btn:not(.primary), .bar .btn:not(.primary) { background: transparent; color: var(--band-text); border-color: var(--band-line); }
  .band .btn:not(.primary):hover, .bar .btn:not(.primary):hover { border-color: var(--band-text); }
  .tabs { display: flex; gap: 4px; margin: 18px 0 0; flex-wrap: wrap; }
  .tab { border: 0; background: none; color: var(--band-muted); font: 400 16px/1.2 var(--serif); cursor: pointer; white-space: nowrap;
         padding: 9px 12px; border-radius: 8px 8px 0 0; }
  .tab:hover { color: var(--band-text); }
  .tab[aria-selected="true"] { color: var(--amber); background: var(--bg); box-shadow: inset 0 2px 0 var(--amber); }   /* folder tab joining the page */
  .tab .n { font: 400 13px/1 var(--sans); margin-left: 4px; opacity: .8; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 8px; }
  .chips:empty { display: none; }
  /* venue chips: filled with a dark-amber edge when shown, faint outline when hidden */
  .chip { border: 1px solid var(--black-line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px;
          font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--chip); border-color: var(--amber-dark); color: var(--text); }
  .chip .n { font-weight: 400; margin-left: 4px; }
  .chip.bad { text-decoration: line-through; opacity: .55; }
  .chip.special { border: 1px solid var(--cloud-dim); background: transparent; color: var(--text); }
  .datebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; margin-bottom: 6px; }
  .datebar input[type=date] { font: inherit; font-size: 15px; font-weight: 600; color: var(--text); background: var(--surface);
                              border: 1px solid var(--amber-dark); border-radius: 8px; padding: 5px 10px; }
  .datebar .btn { padding: 5px 11px; font-size: 15px; }
  .day.group h2 { color: var(--amber); font: 700 19px/1.2 var(--serif); text-transform: none; letter-spacing: 0; }
  .chip.special[aria-pressed="true"] { background: var(--free-bg); color: var(--free); border-color: var(--free-bg); }
  .chip.special.pick[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  .sep { width: 1px; background: var(--line); margin: 2px 4px; }
  .chips { flex-direction: column; gap: 8px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chiprow:empty { display: none; }
  .rowlabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
  .chip.special.genre[aria-pressed="true"] { background: var(--amber); color: var(--black); border-color: var(--amber); }
  .ev .tags { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: .02em; }
  .ev .unknown { color: var(--muted); font-style: italic; }
  .chip.zero { opacity: .45; }   /* nothing matches with the current filters */
  .search { width: 100%; margin: 12px 0 4px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
            background: var(--surface); color: var(--text); font: inherit; }
  .day { margin-top: 28px; }
  .day h2 { font: 700 15px/1.3 var(--serif); letter-spacing: .01em; color: var(--muted);
            margin: 0 0 8px; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 1; }
  .ev { display: grid; grid-template-columns: 26px 64px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
  .ev.wide { grid-template-columns: 26px 110px 1fr; }
  .ev.movie { grid-template-columns: 1fr; }
  .ev.on { background: var(--picked-row); }
  .ev time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; padding-top: 1px; }
  .ev input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0 2px; accent-color: var(--pick); cursor: pointer; }
  .ev .t { color: var(--text); text-decoration: none; font-weight: 600; }
  .ev a.t:hover { color: var(--accent-ink); }
  .ev .where { color: var(--muted); font-size: 13px; }
  .ev .src { color: var(--accent-ink); font-weight: 600; }
  .free { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
          color: var(--free); background: var(--free-bg); border-radius: 4px; padding: 1px 6px; }
  .times { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .times button { font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); background: var(--surface);
                  border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .times button:hover { border-color: var(--accent); }
  .times button[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-text); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--band); color: var(--band-text); border-top: 2px solid var(--amber-dark);
         transform: translateY(110%); transition: transform .2s; z-index: 5; }
  .bar.show { transform: none; }
  .bar .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .count { font-weight: 600; margin-right: auto; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text);
           width: min(560px, calc(100vw - 32px)); padding: 0; }
  dialog::backdrop { background: rgba(0, 0, 0, .8); }
  dialog .hd { padding: 16px 18px 8px; } dialog h3 { margin: 0 0 4px; font: 400 20px/1.2 var(--serif); }
  dialog .list { max-height: 55vh; overflow: auto; padding: 0 18px; }
  dialog .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  dialog .row .w { color: var(--muted); font-size: 13px; }
  dialog .ft { padding: 12px 18px 16px; display: flex; justify-content: flex-end; }
  .toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: var(--chip-on);
           color: var(--chip-on-text); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
           transition: opacity .2s; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; }

  /* ---- thumbnails on every row */
  .ev { grid-template-columns: 26px 64px 1fr 64px; cursor: pointer; }
  .ev.wide { grid-template-columns: 26px 110px 1fr 64px; }
  .ev.movie { grid-template-columns: 1fr 48px; }
  .ev:hover { background: rgba(255, 255, 255, .025); }
  .ev.on:hover { background: var(--picked-row); }
  .thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--surface);
           border: 1px solid var(--line); display: block; }
  .ev.movie .thumb { width: 48px; height: 70px; }
  .thumb.none { background: linear-gradient(135deg, var(--black-2), #1f1a12); }
  .ev .t { cursor: pointer; }
  .badge { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
           border-radius: 4px; padding: 1px 6px; }
  .badge.new { color: var(--black); background: var(--amber); }
  .badge.pick { color: var(--amber); border: 1px solid var(--amber); padding: 0 5px; }

  /* ---- Tonight's picks: large cards */
  .picks { margin-top: 22px; }
  .picks h2 { font: 700 19px/1.2 var(--sans); color: var(--amber); margin: 0 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 5; cursor: pointer;
          border: 1px solid var(--line); background: var(--surface); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .card:hover img { transform: scale(1.04); }
  .card .ov { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px;
              background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .88) 45%); }
  .card .ct { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .card .cw { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .card .cw b { color: var(--amber); font-weight: 600; }
  @media (max-width: 560px) { .cards { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

  /* ---- detail panel (slides up) */
  #detail { padding: 0; width: min(620px, 100%); max-width: 100%; max-height: 92vh; margin: auto auto 0; border-radius: 16px 16px 0 0;
            border: 1px solid var(--amber-dark); border-bottom: 0; overflow: hidden auto; }
  #detail[open] { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (min-width: 700px) { #detail { margin: auto; border-radius: 16px; border-bottom: 1px solid var(--amber-dark); } }
  .dhero { width: 100%; max-height: min(340px, 38vh); object-fit: cover; display: block; background: var(--black); }
  .dbody { padding: 16px 18px 20px; }
  .dbody h3 { margin: 0 0 6px; font: 700 22px/1.2 var(--sans); }
  .dmeta { color: var(--muted); font-size: 14px; display: grid; gap: 3px; margin-bottom: 10px; }
  .dmeta b { color: var(--text); font-weight: 600; }
  .dabout { font-size: 14px; color: var(--text); opacity: .9; margin: 10px 0; white-space: pre-line; }
  .dactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .dactions .btn { font-size: 14px; padding: 8px 12px; }
  .dlisten { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .dlisten a { color: var(--amber); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .dclose { position: absolute; top: 10px; right: 10px; z-index: 2; background: rgba(0,0,0,.7); color: var(--text);
            border: 1px solid var(--line); border-radius: 999px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }

  /* ---- phones: filters fold into one button */
  .filterbtn { display: none; }
  @media (max-width: 640px) {
    .filterbtn { display: flex; width: 100%; justify-content: space-between; align-items: center; margin: 14px 0 0;
                 background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
                 padding: 10px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .filterbtn .on { color: var(--amber); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 10px; }
    .chips:not(.open) .chiprow { display: none; }
    .chips:not(.open) { margin: 6px 0 0; }
  }

  /* ---- List / Map toggle and the map view */
  .searchrow { display: flex; gap: 8px; align-items: center; margin: 12px 0 4px; }
  .searchrow .search { margin: 0; flex: 1; min-width: 0; }
  .seg { display: inline-flex; border: 1px solid var(--amber-dark); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 8px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--amber-dark); }
  .seg button[aria-pressed="true"] { background: var(--amber); color: var(--black); }
  #mapwrap { margin-top: 14px; }
  #mapwrap[hidden] { display: none; }
  #map { height: min(68vh, 640px); min-height: 340px; border-radius: 12px; border: 1px solid var(--line); background: #111;
         isolation: isolate; z-index: 0; }   /* keeps Leaflet's own layers under the page's bars and dialogs */
  .mapnote { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .pin { display: grid; place-items: center; border-radius: 50%; background: var(--amber); color: var(--black);
         border: 2px solid var(--black); box-shadow: 0 0 0 2px rgba(255, 176, 0, .35), 0 2px 6px rgba(0, 0, 0, .6);
         font: 700 13px/1 var(--sans); }
  .leaflet-container { font: 14px/1.4 var(--sans); background: #111; }
  /* the standard (light) OpenStreetMap tiles turned into a dark map: invert, turn the hues back, then dim */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) grayscale(.55) brightness(.8) contrast(1.05); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text);
                                                       border: 1px solid var(--amber-dark); box-shadow: 0 6px 24px rgba(0, 0, 0, .7); }
  .leaflet-popup-content { margin: 12px 12px 10px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); width: 30px; height: 30px; font-size: 22px; }
  .leaflet-control-zoom a { background: var(--surface); color: var(--text); border-color: var(--line); }
  .leaflet-control-zoom a:hover { background: var(--black-line); color: var(--amber); }
  .leaflet-control-attribution { background: rgba(11, 11, 11, .75) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--cloud-dim); }
  .mpop h4 { margin: 0 24px 2px 0; font: 700 16px/1.2 var(--sans); color: var(--amber); }
  .mpop .msub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .mpop .mday { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 8px 0 2px; }
  .mrow { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none;
          color: var(--text); font: inherit; padding: 7px 0; cursor: pointer; }
  .mrow:hover .mt { color: var(--amber); }
  .mrow .mt { font-weight: 600; font-size: 14px; }
  .mrow .mm { color: var(--muted); font-size: 12px; }
  .mrow .mm b { color: var(--amber); font-weight: 600; }
  .mrow .free { margin-left: 4px; }
</style>
</head>
<body>
<div class="band"><div class="in">
  <header>
    <div class="brand">
      <img class="logo" src="logo.webp?v=3" alt="Site logo" width="203" height="208">
      <div>
        <h1 id="title"><img class="wordmark" src="wordmark.webp?v=4" alt="Go Out Montreal" width="2000" height="139"></h1>
        <div class="meta" id="meta">Loading…</div>
      </div>
    </div>
    <div class="sub" title="Subscribe to every event in this tab. The feed updates automatically.">
      <a class="btn primary" id="gcal" target="_blank" rel="noopener">Subscribe in Google Calendar</a>
      <a class="btn" id="webcal">Apple / Outlook</a>
      <button class="btn" id="copy">Copy feed URL</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></div>
<div class="wrap">
  <button class="filterbtn" id="filterbtn" aria-expanded="false" aria-controls="chips"><span>Filters</span><span class="on" id="filteron"></span></button>
  <div class="chips" id="chips"></div>
  <div class="searchrow">
    <input class="search" id="q" type="search">
    <div class="seg" role="group" aria-label="View">
      <button id="vlist" aria-pressed="true">List</button>
      <button id="vmap" aria-pressed="false">Map</button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <main id="list"></main>
  <section id="mapwrap" hidden aria-label="Map of venues">
    <div id="map"></div>
    <div class="mapnote" id="mapnote"></div>
  </section>
</div>
<div class="bar" id="bar"><div class="in">
  <span class="count" id="count"></span>
  <button class="btn primary" id="dl">Add to calendar (.ics)</button>
  <button class="btn" id="gpick">Google Calendar…</button>
  <button class="btn" id="clear">Clear</button>
</div></div>
<dialog id="gdlg">
  <div class="hd">
    <h3>Add to Google Calendar</h3>
    <div class="meta">Google only takes one event per link, so add each one below.
      For many at once, use <b>Add to calendar (.ics)</b> and import the file in Google Calendar
      (Settings → Import &amp; export).</div>
  </div>
  <div class="list" id="glist"></div>
  <div class="ft"><button class="btn" id="gclose">Done</button></div>
</dialog>
<dialog id="detail" aria-label="Event details">
  <button class="dclose" id="dclose" aria-label="Close">×</button>
  <div id="dcontent"></div>
</dialog>
<div class="toast" id="toast">Copied</div>
<script>
const TAB_LABEL = { music: "Music & Dance", other: "Other Events", bars: "Bar Nights", museums: "Museums & Galleries", movies: "Movies",
                    date: "By Date" };
const PLACEHOLDER = { music: "Search artists, titles, rooms…", other: "Search events, venues…",
                      bars: "Search bars, streets…", museums: "Search exhibitions, museums, galleries…", movies: "Search films, cinemas…",
                      date: "Search this day…" };
// "By Date" view: everything on one day, in this order of types
const DAY_GROUPS = [
  ["Music & Dance", e => e.tab === "music"],
  ["Other Events", e => e.tab === "other"],
  ["Bar Nights", e => e.tab === "bars"],
  ["Museum events", e => e.tab === "museums" && e.kind !== "exhibition"],
  ["Exhibitions on view", e => e.tab === "museums" && e.kind === "exhibition"],
  ["Movies", e => e.tab === "movies"],
];
const EVENT_TABS = ["music", "other", "bars"];   // tabs filtered by venue chips
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

    body.appendChild(titleLine(e));

      w.appendChild(el("span", "src", e.source));

    if (!e.free && e.price) w.append(" · " + e.price);
    else if (!e.free && price !== "any" && e.tab !== "museums") w.appendChild(el("span", "unknown", " · price unknown"));
    body.appendChild(w);
    if (e.genres && e.genres.length) body.appendChild(el("div", "tags", e.genres.join(" · ")));

  function render() {
    const term = $("q").value.trim().toLowerCase();
    const list = $("list"); list.innerHTML = "";
    list.hidden = view === "map"; $("mapwrap").hidden = view !== "map"; $("hint").hidden = view === "map";
    if (view === "map") return renderMap(visible(term));
    if (tab === "date") return renderDay(list, term);
    const inTab = events.filter(e => e.tab === tab);
    let shown = inTab.filter(e => matches(e, term) && passes(e, inTab) && (!picksOnly || picked.has(e.id)));
    if (tab === "museums") {
      shown = shown.filter(e => placeKinds.has(placeKind(e)));
      if (museumView !== "events") return renderExhibitions(list, shown.filter(e => e.kind === "exhibition"), museumView);
      shown = shown.filter(e => e.kind !== "exhibition");

      shown = shown.filter(e => !hidden.has(e.source));

    if (!shown.length) { list.innerHTML = `<p class="empty">${picksOnly ? "Nothing selected in this tab yet." : "Nothing matches."}</p>`; return; }
    // "Tonight's picks": big cards on top of Music & Dance and Other Events when no filter or search is on
    const filtering = term || picksOnly || fresh || when !== "any" || slot !== "any" || price !== "any" || genreSel.size;
    if ((tab === "music" || tab === "other") && !filtering) {
      const daysAgo = s => s ? (noon(today) - noon(s)) / 864e5 : 99;
      const score = e => (e.pick ? 10 : 0) + (daysAgo(e.added) <= 3 ? 3 : 0) + (isNew(e) ? 2 : 0)
                         + (e.free || e.price_lo != null ? 1 : 0) + (e.genres && e.genres.length ? .5 : 0);
      const tonight = shown.filter(e => e.key === today && e.image && e.kind !== "exhibition")
                           .sort((a, b) => score(b) - score(a) || a.d - b.d).slice(0, 4);
      if (tonight.length >= 2) {
        const sec = el("section", "picks"); sec.appendChild(el("h2", null, "Tonight"));
        const grid = el("div", "cards");

          const w = el("div", "cw"); w.appendChild(el("b", null, e.all_day ? e.source : `${timeFmt.format(e.d)} · ${e.source}`));
          if (e.free) w.append(" · Free"); else if (e.price) w.append(" · " + e.price);

      ((a.start > today) - (b.start > today)) ||

      const sec = el("section", "day"); sec.appendChild(el("h2", null, "Ongoing · several days"));
      for (const e of ongoing)
        exhibitionRow(e, sec, e.start <= today ? "until " + fmtShort(e.end) : fmtShort(e.start) + " – " + fmtShort(e.end));
      list.appendChild(sec);

    for (const e of shown) {
      if (e.key !== cur) {
        cur = e.key; sec = el("section", "day"); sec.appendChild(el("h2", null, dayFmt.format(e.d)));
        list.appendChild(sec);
      }
      addRow(e, sec, groups);
    }
  }

  function renderDay(list, term) {
    const all = events.filter(e => onDay(e, dayPick));
    const shown = all.filter(e => matches(e, term) && passes(e, all) && (!picksOnly || picked.has(e.id)));
    for (const [label, test] of DAY_GROUPS) {
      const items = shown.filter(test);
      if (!items.length) continue;
      const count = label === "Movies" ? new Set(items.map(e => e.source + "|" + e.title)).size + " films" : items.length;
      const sec = el("section", "day group"); sec.appendChild(el("h2", null, `${label} · ${count}`));
      const groups = new Map();
      for (const e of items) addRow(e, sec, groups);
      list.appendChild(sec);
    }
    if (!list.children.length) {
      list.innerHTML = `<p class="empty">${all.length ? "Nothing matches." : "Nothing listed for this day yet."}</p>`;
    }
  }

  const fmtShort = s => { const d = noon(s); return (d.getFullYear() === new Date().getFullYear() ? shortFmt : shortYFmt).format(d); };
  function exhibitionRow(e, sec, when) {
    const row = el("div", "ev wide");
    row.append(checkbox(e, row), el("time", null, when));
    const body = el("div"); body.appendChild(titleLine(e));
    const w = el("div", "where"); w.appendChild(el("span", "src", e.location || e.source));
    body.appendChild(w); row.append(body, thumb(e)); openable(row, e); sec.appendChild(row);
  }

  // "now": open today, closing soonest first · "soon": opening later, soonest first.
  // Each list is split into museums and galleries when both are shown.
  function renderExhibitions(list, shown, view) {
    const items = view === "now"
      ? shown.filter(e => e.start <= today).sort((a, b) => a.end.localeCompare(b.end))
      : shown.filter(e => e.start > today).sort((a, b) => a.start.localeCompare(b.start));
    if (!items.length) {
      list.innerHTML = `<p class="empty">${view === "now" ? "Nothing on view matches." : "Nothing coming up matches."}</p>`; return;
    }
    const when = view === "now" ? (e => "until " + fmtShort(e.end)) : (e => fmtShort(e.start) + " – " + fmtShort(e.end));
    const head = view === "now" ? "On now · closing soonest first" : "Coming up · opening soonest first";
    for (const [k, label] of [["museum", "Museums"], ["gallery", "Galleries"]]) {
      const part = items.filter(e => placeKind(e) === k);
      if (!part.length) continue;
      const sec = el("section", "day"); sec.appendChild(el("h2", null, `${label} · ${head}`));
      for (const e of part) exhibitionRow(e, sec, when(e));

  }

  // ---------- map view: one pin per place, listing the events that pass the current filters
  // The events the list would show right now (tab, search, Selected, venue chips, quick filters, museum view).
  function visible(term) {
    if (tab === "date") {
      const all = events.filter(e => onDay(e, dayPick));
      return all.filter(e => matches(e, term) && passes(e, all) && (!picksOnly || picked.has(e.id)));
    }
    const inTab = events.filter(e => e.tab === tab);
    let shown = inTab.filter(e => matches(e, term) && passes(e, inTab) && (!picksOnly || picked.has(e.id)));
    if (tab === "museums") {
      shown = shown.filter(e => placeKinds.has(placeKind(e)));
      if (museumView === "events") return shown.filter(e => e.kind !== "exhibition");
      return shown.filter(e => e.kind === "exhibition" && (museumView === "now" ? e.start <= today : e.start > today));
    }
    return picksOnly ? shown : shown.filter(e => !hidden.has(e.source));
  }
  // Leaflet (cdnjs, pinned version + integrity hash) is only fetched the first time the map is opened
  const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
  let leafletReady = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletReady) return leafletReady;
    const css = el("link"); css.rel = "stylesheet"; css.href = LEAFLET + "leaflet.min.css"; css.crossOrigin = "anonymous";
    css.integrity = "sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==";
    css.referrerPolicy = "no-referrer";

    leafletReady = new Promise((ok, fail) => {
      const s = el("script"); s.src = LEAFLET + "leaflet.min.js"; s.crossOrigin = "anonymous"; s.referrerPolicy = "no-referrer";
      s.integrity = "sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==";

  let map = null, pinLayer = null, fittedFor = null;

  // What a pin is called: the room / bar / library when the location names one, else the venue
  function placeName(e) {
    const loc = (e.location || "").split(",")[0].trim();
    if (e.tab === "museums") return loc || e.source;
    return loc && !sameish(loc, e.source) && !/^montr[ée]al$/i.test(loc) ? loc : e.source;
  }
  function renderMap(shown) {
    const note = $("mapnote");
    note.textContent = "Loading map…";
    loadLeaflet().then(() => {
      if (view !== "map") return;
      if (!map) setupMap();
      map.invalidateSize();   // the box was hidden while the list showed
      drawPins(shown);

  }
  function drawPins(shown) {
    pinLayer.clearLayers();
    const places = new Map();
    let off = 0;
    for (const e of shown) {
      if (e.lat == null || e.lng == null) { off++; continue; }
      const k = e.lat.toFixed(5) + "," + e.lng.toFixed(5);
      if (!places.has(k)) places.set(k, { lat: e.lat, lng: e.lng, evs: [] });
      places.get(k).evs.push(e);
    }
    const bounds = [];
    for (const p of places.values()) {
      const n = p.evs.length, size = Math.round(26 + Math.min(n, 20) * 0.6);
      const icon = L.divIcon({ className: "", html: `<div class="pin" style="width:${size}px;height:${size}px">${n}</div>`,
                               iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
      const names = [...new Set(p.evs.map(placeName))];

      m.bindPopup(() => placePopup(p.evs, names), { maxWidth: 300, minWidth: 220, maxHeight: 320, autoPanPadding: [16, 16] });

      : `${n} event${n === 1 ? "" : "s"} at ${places.size} place${places.size === 1 ? "" : "s"}` +
        (off ? ` · ${off} without a known address (see List)` : "") + " · tap a pin to see what's on";
    // frame the pins when the map opens and when the tab or a filter changes; typing a search or opening a pin's
    // list keeps where the visitor is looking
    const fitKey = JSON.stringify([tab, tab === "date" ? dayPick : "", when, slot, price, fresh, picksOnly, [...genreSel],
                                   tab === "museums" ? [museumView, ...placeKinds] : [...hidden]]);
    if (bounds.length && fittedFor !== fitKey) {

  }
  // A pin's list: by day, then time; repeats of one title on a day (film showtimes) share a row
  function placePopup(evs, names) {
    const box = el("div", "mpop");
    box.appendChild(el("h4", null, names.slice(0, 2).join(" / ") + (names.length > 2 ? " +" : "")));
    box.appendChild(el("div", "msub", `${evs.length} event${evs.length === 1 ? "" : "s"}`));
    const sorted = [...evs].sort((a, b) => (a.kind === "exhibition") - (b.kind === "exhibition") || a.d - b.d);
    const rows = new Map();
    for (const e of sorted) {
      const k = (e.kind === "exhibition" ? "ongoing" : e.key) + "|" + e.title;
      if (!rows.has(k)) rows.set(k, []);
      rows.get(k).push(e);
    }
    let day = null, shownRows = 0;
    const MAX = 40;
    for (const group of rows.values()) {
      if (shownRows === MAX) { box.appendChild(el("div", "msub", `+ ${rows.size - MAX} more · narrow it down with the filters`)); break; }
      const e = group[0];
      const dk = e.kind === "exhibition" ? "ongoing" : e.key;
      if (dk !== day) {
        day = dk;
        box.appendChild(el("div", "mday", dk === "ongoing" ? "Ongoing" : dk === today ? "Tonight · " + dayFmt.format(e.d) : dayFmt.format(e.d)));
      }
      const b = el("button", "mrow"); b.type = "button";
      const t = el("div", "mt", e.title);
      if (e.free) t.appendChild(el("span", "free", "FREE"));
      const meta = el("div", "mm");
      const when = e.kind === "exhibition" ? (e.start <= today ? "until " + fmtShort(e.end) : fmtShort(e.start) + " – " + fmtShort(e.end))
                 : e.all_day ? "Time TBA" : group.map(x => timeFmt.format(x.d)).join(", ");
      meta.appendChild(el("b", null, when));
      const room = placeName(e);
      if (names.length > 1 || !sameish(room, names[0])) meta.append(" · " + room);
      if (!e.free && e.price) meta.append(" · " + e.price);
      b.append(t, meta);
      b.onclick = () => openDetail(e);

    return box;
  }
  function setView(v) {
    view = v; store.set("view", v);
    $("vlist").setAttribute("aria-pressed", String(v === "list"));
    $("vmap").setAttribute("aria-pressed", String(v === "map"));
    render();
  }
  $("vlist").onclick = () => setView("list");
  $("vmap").onclick = () => setView("map");
  $("vlist").setAttribute("aria-pressed", String(view === "list"));
  $("vmap").setAttribute("aria-pressed", String(view === "map"));

  // ---------- detail panel
  // First act on a bill, for the "Listen" links: drop "X presents:", then cut at +, /, b2b, w/, " - ", " x "…
  function firstArtist(title) {
    let t = title.replace(/^.*?\b(?:pr[ée]sente?s?|invites?|presents)\s*:?\s*/i, "");
    if (/:/.test(t) && t.split(":")[1].trim()) t = t.split(":").slice(1).join(":");
    t = t.split(/\s+(?:\+|\/|&|b2b|b3b|w\/|with|avec|feat\.?|ft\.?|x|-|–|—|•|\|)\s+|,|\(|\[/i)[0];
    return t.replace(/\b(all night long|live|dj set|album release|lancement)\b/gi, "").trim();
  }
  const MUSICISH = new Set(["music", "bars"]);
  function openDetail(e) {
    const box = $("dcontent"); box.innerHTML = "";
    if (e.image) {
      const img = el("img", "dhero"); img.src = e.image; img.alt = ""; img.referrerPolicy = "no-referrer";
      img.onerror = () => img.remove(); box.appendChild(img);
    }
    const b = el("div", "dbody");
    const h = el("h3", null, e.title);
    if (e.free) h.appendChild(el("span", "free", "FREE"));
    if (isNew(e)) h.appendChild(el("span", "badge new", "NEW"));
    if (e.pick) h.appendChild(el("span", "badge pick", "EDITOR'S PICK"));
    b.appendChild(h);
    const meta = el("div", "dmeta");
    const line = (label, text) => { if (!text) return; const d = el("div"); d.append(el("b", null, label + " "), text); meta.appendChild(d); };
    if (e.kind === "exhibition")
      line("When", e.start <= today ? `On now, until ${fmtShort(e.end)}` : `${fmtShort(e.start)} – ${fmtShort(e.end)}`);
    else {
      let when = dayFmt.format(e.d);
      if (!e.all_day) {
        when += ", " + timeFmt.format(e.d);
        const end = e.end ? new Date(e.end) : null;
        if (end && !isNaN(end) && end > e.d) when += " – " + timeFmt.format(end);
      } else when += " · time TBA";
      line("When", when);
    }
    line("Where", [e.source, e.location && !sameish(e.location, e.source) ? e.location : ""].filter(Boolean).join(" · "));
    line("Price", e.free ? "Free" : e.price || "Not listed");
    if (e.genres && e.genres.length) line("Genre", e.genres.join(" · "));
    else if (e.kind && e.kind !== "exhibition") line("Type", e.kind);
    b.appendChild(meta);
    if (e.about) b.appendChild(el("div", "dabout", e.about));
    if (e.tab === "movies") {   // the film's other showtimes that day at that cinema
      const same = events.filter(x => x.tab === "movies" && x.key === e.key && x.source === e.source && x.title === e.title);
      if (same.length > 1) {
        const tms = el("div", "times");
        for (const x of same) {
          const bt = el("button", null, timeFmt.format(x.d)); bt.setAttribute("aria-pressed", String(picked.has(x.id)));
          bt.onclick = () => { toggle(x.id); bt.setAttribute("aria-pressed", String(picked.has(x.id))); };
          tms.appendChild(bt);
        }
        b.append(el("div", "hint", "Showtimes that day (tap to select):"), tms);
      }
    }
    const acts = el("div", "dactions");
    if (e.url) acts.appendChild(link(e.url, "btn primary", e.price || e.free ? "Tickets & info" : "More info"));
    const where = [e.location, e.source].filter(Boolean).join(", ");
    if (where) acts.appendChild(link("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(where + ", Montréal"), "btn", "Map"));
    const ical = el("button", "btn", "Add to calendar");
    ical.onclick = () => {
      const blob = new Blob([ics([e])], { type: "text/calendar;charset=utf-8" });
      const a = el("a"); a.href = URL.createObjectURL(blob); a.download = "event.ics";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
    acts.appendChild(ical);
    const g = googleLinks(e)[0]; if (g) acts.appendChild(link(g[1], "btn", "Google Calendar"));
    const share = el("button", "btn", "Share");
    share.onclick = async () => {
      const url = location.origin + location.pathname + "#e/" + encodeURIComponent(e.id);
      const text = `${e.title} · ${e.kind === "exhibition" ? "until " + fmtShort(e.end) : dayFmt.format(e.d)}`;

    acts.appendChild(share);
    const sel = el("button", "btn", picked.has(e.id) ? "Selected ✓" : "Select");
    sel.onclick = () => { toggle(e.id); sel.textContent = picked.has(e.id) ? "Selected ✓" : "Select"; render(); };
    acts.appendChild(sel);
    b.appendChild(acts);
    if (MUSICISH.has(e.tab) && !/trivia|karaok|comedy|open mic|quiz/i.test(e.title)) {
      const who = firstArtist(e.title);
      if (who.length > 1) {
        const l = el("div", "dlisten"); l.append("Listen: " + who + " ");
        const q = encodeURIComponent(who);
        l.append(link("https://www.youtube.com/results?search_query=" + q, null, "YouTube"),
                 link("https://open.spotify.com/search/" + q, null, "Spotify"),
                 link("https://bandcamp.com/search?q=" + q, null, "Bandcamp"));
        b.appendChild(l);
      }
    }
    box.appendChild(b);
    history.replaceState(null, "", "#e/" + encodeURIComponent(e.id));
    if (!$("detail").open) $("detail").showModal();
  }
  $("dclose").onclick = () => $("detail").close();
  $("detail").addEventListener("click", ev => { if (ev.target === $("detail")) $("detail").close(); });   // tap outside
  $("detail").addEventListener("close", () => history.replaceState(null, "", tab === "date" ? "#date/" + dayPick : "#" + tab));

  window.addEventListener("hashchange", () => {
    const h = fix(location.hash.slice(1));
    const d = (location.hash.match(/^#date\/(\d{4}-\d{2}-\d{2})$/) || [])[1];
    if (h === "date" && d && d !== dayPick) { dayPick = d; select("date"); }
    else if (allTabs.includes(h) && h !== tab) select(h);
  });
  store.set("picked", [...picked]);
  updateBar();
  // a shared link (#e/<id>) opens that event in its own tab
  const shared = (location.hash.match(/^#e\/(.+)$/) || [])[1];
  const sharedEv = shared && byId.get(decodeURIComponent(shared));
  if (sharedEv) tab = sharedEv.tab;
  select(tab);
  if (sharedEv) openDetail(sharedEv);
  else if (shared) toast("That event has already happened");
}).catch(err => { $("meta").textContent = "Could not load events.json (" + err + ")"; console.error(err); });

// installable app + offline: see sw.js
if ("serviceWorker" in navigator && location.protocol === "https:")
  navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
