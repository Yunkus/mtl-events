name: Update events

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write
  issues: write   # scrape.py's alerts (a venue failing or going empty) become an issue

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # put fresh output on top of whatever is on main now (another run may have pushed meanwhile)
          files="events.json calendar.ics music.ics other.ics bars.ics museums.ics movies.ics"
          for f in $files; do cp "docs/$f" "$RUNNER_TEMP/"; git checkout -- "docs/$f" 2>/dev/null || rm -f "docs/$f"; done
          git pull --ff-only origin main
          for f in $files; do cp "$RUNNER_TEMP/$f" docs/; git add "docs/$f"; done
          git diff --cached --quiet || git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Open an issue for new problems
        if: hashFiles('alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The $(date -u +%Y-%m-%d) update found a problem with these sources:"
            echo
            cat alerts.md
            echo
            echo "The rest of the calendar kept updating. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue.md
          gh issue create --title "Event sources need attention ($(date -u +%Y-%m-%d))" --body-file issue.md
