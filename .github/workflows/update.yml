name: Update events

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # put fresh output on top of whatever is on main now (another run may have pushed meanwhile)
          files="events.json calendar.ics music.ics other.ics bars.ics museums.ics movies.ics"
          for f in $files; do cp "docs/$f" "$RUNNER_TEMP/"; git checkout -- "docs/$f" 2>/dev/null || rm -f "docs/$f"; done
          git pull --ff-only origin main
          for f in $files; do cp "$RUNNER_TEMP/$f" docs/; git add "docs/$f"; done
          git diff --cached --quiet || git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
